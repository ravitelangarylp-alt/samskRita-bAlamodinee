    body::after {

    .container {

      border-radius: 30px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(74,37,17,0.2);
      text-align: center;
      position: relative;
      border: 3px double var(--gold);

    .header-band { margin-bottom: 10px; }
    .presenter {

    .level-badge {

      font-family: 'Inknut Antiqua', serif; font-size: 15px; font-weight: 600;
      letter-spacing: 0.05em; margin: 10px 0 15px;
      box-shadow: 0 4px 12px rgba(128,0,0,0.3);
    }
    .info-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin: 10px 0; flex-wrap: wrap; gap: 10px;
    }
    .timer { font-size: 1.2em; font-weight: bold; color: var(--saffron); }
    .score-display { font-size: 1.2em; font-weight: bold; color: #2e7d32; }
    .difficulty-select {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;
    }
    .diff-btn {
      padding: 10px 20px; border: none; border-radius: 25px;
      background: #f0deb4; color: var(--ink-brown);
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .diff-btn.active {
      background: var(--saffron); color: white;
      box-shadow: 0 4px 10px rgba(232,106,23,0.4);
    }
    .question-card {
      background: #fff3e0; border-radius: 20px;
      padding: 25px; margin: 15px 0;
      border: 3px solid var(--gold);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);

    .vakya-display {
      font-family: 'Laila', serif;
      font-size: 1.8em; font-weight: 600;
      color: var(--ink-brown);
      background: #f9e4b7;
      padding: 15px;
      border-radius: 15px;
      margin: 10px 0;
    }
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin: 15px 0;
    }
    .option-btn {
      padding: 18px 20px; font-size: 1.3em;
      border: 2px solid var(--gold);
      border-radius: 15px;
      background: #fff8e1;
      color: var(--ink-brown);
      font-family: 'Inknut Antiqua', serif;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn:hover { background: #ffe082; transform: scale(1.03); }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
    .option-btn.correct { background: #81c784; border-color: #2e7d32; }
    .option-btn.wrong { background: #ef9a9a; border-color: #c62828; }
    .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 30px; cursor: pointer;
      font-weight: bold; margin: 5px; transition: 0.2s; font-size: 1em;
    }
    .back-btn { background: var(--gold); color: white; }
    .next-btn { background: #1565c0; color: white; font-size: 1.2em; }
    .restart-btn { background: var(--ink-maroon); color: white; }
    .btn:hover { transform: translateY(-2px); }
    .feedback { font-size: 1.2em; margin: 10px 0; min-height: 30px; }
    .mantra {
      background: var(--ink-maroon); color: var(--gold-light);
      margin-top: 15px; padding: 10px; border-radius: 10px;
      font-family: 'Inknut Antiqua', serif; font-size: 14px;

  </style>
</head>

        { kannada: 'ನೀನು ಪ್ರಶ್ನಿಸಿದೆ', correct: 'अपृच्छः', options: ['अपृच्छः','अपृच्छत्','अपृच्छम्','अपृच्छन्'] },
        { kannada: 'ನಾನು ತೆಗೆದುಕೊಂಡೆನು', correct: 'अगृह्णाम्', options: ['अगृह्णाम्','अगृह्णात्','अगृह्णाः','अगृह्णन्'] },
        { kannada: 'ಅವನು ನಮಸ್ಕರಿಸಿದನು', correct: 'अनमत्', options: ['अनमत्','अनमः','अनमम्','अनमन्'] },
        { kannada: 'ನೀನು ಹಾಡಿದೆ', correct: 'अगायः', options: ['अगायः','अगायत्','अगायम्','अगायन्'] },
        { kannada: 'ನಾನು ಸ್ನಾನ ಮಾಡಿದೆನು', correct: 'अस्नासम्', options: ['अस्नासम्','अस्नात्','अस्नाः','अस्नान्'] },
        { kannada: 'ಅವನು ನಡೆದನು', correct: 'अचलत्', options: ['अचलत्','अचलः','अचलम्','अचलन्'] },

        { kannada: 'ಅವನು ನೆನಪಿಸಿಕೊಂಡನು', correct: 'अस्मरत्', options: ['अस्मरत्','अस्मरः','अस्मरम्','अस्मरन्'] },
        { kannada: 'ನೀನು ಖರೀದಿಸಿದೆ', correct: 'अक्रीणाः', options: ['अक्रीणाः','अक्रीणात्','अक्रीणाम्','अक्रीणन्'] },
        { kannada: 'ನಾನು ಬಿಟ್ಟೆನು', correct: 'अत्यजम्', options: ['अत्यजम्','अत्यजत्','अत्यजः','अत्यजन्'] },
        { kannada: 'ಅವನು ಬಿದ್ದನು', correct: 'अपतत्', options: ['अपतत्','अपतः','अपतम्','अपतन्'] },
        { kannada: 'ನೀನು ಎಣಿಸಿದೆ', correct: 'अगणयः', options: ['अगणयः','अगणयत्','अगणयम्','अगणयन्'] },
        { kannada: 'ನಾನು ಆದೆನು', correct: 'अभवम्', options: ['अभवम्','अभवत्','अभवः','अभवन्'] },
        { kannada: 'ಅವನು ರಕ್ಷಿಸಿದನು', correct: 'अरक्षत्', options: ['अरक्षत्','अरक्षः','अरक्षम्','अरक्षन्'] },
        { kannada: 'ನೀನು ಮಾರಿದೆ', correct: 'अविक्रीणाः', options: ['अविक्रीणाः','अविक्रीणात्','अविक्रीणाम्','अविक्रीणन्'] },
        { kannada: 'ನಾನು ಅತ್ತೆನು', correct: 'अरोदम्', options: ['अरोदम्','अरोदत्','अरोदः','अरुदन्'] },
        { kannada: 'ಅವನು ತೊಳೆದನು', correct: 'प्राक्षालयत्', options: ['प्राक्षालयत्','प्राक्षालयः','प्राक्षालयम्','प्राक्षालयन्'] },
        { kannada: 'ನೀನು ಭೇಟಿಯಾದೆ', correct: 'अमिलः', options: ['अमिलः','अमिलत्','अमिलम्','अमिलन्'] },
        { kannada: 'ನಾನು ಕರೆದೆನು', correct: 'आह्वयम्', options: ['आह्वयम्','आह्वयत्','आह्वयः','आह्वयन्'] },
        { kannada: 'ಅವನು ಸ್ವೀಕರಿಸಿದನು', correct: 'स्व्यकरोत्', options: ['स्व्यकरोत्','स्व्यकरोः','स्व्यकरवम्','स्व्यकुर्वन्'] },
        { kannada: 'ನೀನು ನರ್ತಿಸಿದೆ', correct: 'अनृत्यः', options: ['अनृत्यः','अनृत्यत्','अनृत्यम्','अनृत्यन्'] },
      ]
    }
  };

  let currentDifficulty = 'easy';
  let currentQuestion = 0;
  let questions = [];
  let score = 0;
  let timer = 120;
  let timerInterval = null;
  let answered = false;
  let gameComplete = false;

  const app = document.getElementById('app');

  function shuffle(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function prepareQuestions(diff) {
    return shuffle(verbData[diff].questions);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timer = 120;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timer--;
      updateTimerDisplay();
      if (timer <= 0) { clearInterval(timerInterval); endGame(false); }
    }, 1000);
  }

  function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (el) { el.textContent = `⏱️ ${timer} से`; el.style.color = timer<=10?'#d32f2f':'#e86a17'; }
  }

  function endGame(won) {
    gameComplete = true;
    clearInterval(timerInterval);
    const fb = document.getElementById('feedback');
    if (fb) {
      fb.innerHTML = won
        ? `🎉 अभिनन्दनम्! Score: ${score}/${questions.length*10}`
        : `⏰ कालवसानम्! Score: ${score}`;
    }
    const controls = document.querySelector('.controls');
    if (controls) {
      controls.innerHTML = `<button class="btn restart-btn" onclick="location.reload()">🔄 पुनः क्रीडामः</button>`;
    }
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      answered = false;
      renderQuestion();
    } else {
      endGame(true);
    }
  }

  function renderQuestion() {
    if (gameComplete) return;
    const q = questions[currentQuestion];

    const html = `
      <div class="header-band">
        <p class="presenter">Team Trayee — तृयी — Presents</p>
        <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0;">
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
          <span style="font-family:'Inknut Antiqua',serif;font-size:24px;color:#e86a17;">ॐ</span>
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
        </div>
        <div class="level-badge">Level 6 · धातु-रूपाणि (${verbData[currentDifficulty].name})</div>
      </div>
      <button class="btn back-btn" onclick="window.location.href='./index.html'">🗺️ मुख्य-नक्षा</button>
      <div class="info-bar">
        <span class="timer" id="timerDisplay">⏱️ ${timer} से</span>
        <span class="score-display" id="scoreDisplay">अङ्काः: ${score}</span>
        <span>प्रश्न ${currentQuestion+1}/${questions.length}</span>
      </div>
      <div class="difficulty-select">
        ${['easy','medium','hard'].map(d=>`
          <button class="diff-btn ${d===currentDifficulty?'active':''}" data-diff="${d}">
            ${d==='easy'?'🌸 लट्':d==='medium'?'📖 लोट्':'⚡ लङ्'}
          </button>
        `).join('')}
      </div>
      <div class="question-card">
        <div class="vakya-display">${q.kannada}</div>
        <div style="font-size:1.2em;color:var(--ink-maroon);margin-top:10px;">
          संस्कृतेन किम्?
        </div>
      </div>
      <div class="options-grid" id="optionsGrid">
        ${q.options.map(opt=>`<button class="option-btn">${opt}</button>`).join('')}
      </div>
      <div class="controls" id="controlsArea">
        <button class="btn next-btn" id="nextBtn" style="display:none;">⏩ अग्रिमः</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="mantra">तद्धि तपस्तद्धि तपः</div>
    `;
    app.innerHTML = html;

    document.querySelectorAll('#optionsGrid .option-btn').forEach(b => {
      b.addEventListener('click', function(e) {
        if (answered || gameComplete) return;
        const selected = e.target.textContent;
        const correct = questions[currentQuestion].correct;
        const allBtns = document.querySelectorAll('#optionsGrid .option-btn');
        allBtns.forEach(btn => btn.disabled = true);
        answered = true;

        if (selected === correct) {
          e.target.classList.add('correct');
          score += 10;
          document.getElementById('feedback').textContent = '✅ सम्यक्! +10';
        } else {
          e.target.classList.add('wrong');
          score = Math.max(0, score - 2);
          document.getElementById('feedback').textContent = `❌ उत्तरम्: ${correct} (-2)`;
          allBtns.forEach(btn => {
            if (btn.textContent === correct) btn.classList.add('correct');
          });
        }
        document.getElementById('scoreDisplay').textContent = `अङ्काः: ${score}`;
        document.getElementById('nextBtn').style.display = 'inline-block';
      });
    });

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);

    document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', function(e) {
      currentDifficulty = e.target.dataset.diff;
      questions = prepareQuestions(currentDifficulty);
      currentQuestion = 0;
      score = 0;
      answered = false;
      gameComplete = false;
      clearInterval(timerInterval);
      renderQuestion();
      startTimer();
    }));

    updateTimerDisplay();
  }

  function init() {
    questions = prepareQuestions(currentDifficulty);
    currentQuestion = 0;
    score = 0;
    answered = false;
    gameComplete = false;
    renderQuestion();
    startTimer();
  }

  init();
})();
</script>
