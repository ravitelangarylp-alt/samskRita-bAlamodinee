    }

    .score-display { font-size: 1.2em; font-weight: bold; color: #2e7d32; }
    .difficulty-select {
      display: flex; gap: 10px; justify-content: center; margin-bottom: 15px;
    }
    .diff-btn {
      padding: 10px 20px; border: none; border-radius: 25px;
      background: #f0deb4; color: var(--ink-brown);
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .diff-btn.active {
      background: var(--saffron); color: white;
      box-shadow: 0 4px 10px rgba(232,106,23,0.4);
    }
    .question-card {
      background: #fff3e0; border-radius: 20px;
      padding: 25px; margin: 15px 0;
      border: 3px solid var(--gold);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);

      font-family: 'Laila', serif;
      font-size: 1.8em; font-weight: 600;
      color: var(--ink-brown);
      background: #f9e4b7;
      padding: 15px;
      border-radius: 15px;
      margin: 10px 0;
    }
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin: 15px 0;
    }
    .option-btn {
      padding: 18px 20px; font-size: 1.3em;
      border: 2px solid var(--gold);
      border-radius: 15px;
      background: #fff8e1;
      color: var(--ink-brown);
      font-family: 'Inknut Antiqua', serif;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .option-btn:hover { background: #ffe082; transform: scale(1.03); }
    .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
    .option-btn.correct { background: #81c784; border-color: #2e7d32; }
    .option-btn.wrong { background: #ef9a9a; border-color: #c62828; }
    .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 20px; border: none; border-radius: 30px; cursor: pointer;
      font-weight: bold; margin: 5px; transition: 0.2s; font-size: 1em;
    }
    .back-btn { background: var(--gold); color: white; }
    .next-btn { background: #1565c0; color: white; font-size: 1.2em; }
    .restart-btn { background: var(--ink-maroon); color: white; }

    .feedback { font-size: 1.2em; margin: 10px 0; min-height: 30px; }
    .mantra {

    hard: {

      questions: [
        { kannada: 'ಅವನು ಹೋಗುವನು', correct: 'गमिष्यति', options: ['गमिष्यति','गत्वा','गन्तुम्','गच्छति'] },

        { kannada: 'ನೀನು ನೋಡುವೆ', correct: 'द्रक्ष्यसि', options: ['द्रक्ष्यसि','दृष्ट्वा','द्रष्टुम्','पश्यसि'] },
        { kannada: 'ಅವನು ಬರೆಯುವನು', correct: 'लेखिष्यति', options: ['लेखिष्यति','लिखित्वा','लेखितुम्','लिखति'] },
        { kannada: 'ನಾನು ಕೇಳುವೆನು', correct: 'श्रोष्यामि', options: ['श्रोष्यामि','श्रुत्वा','श्रोतुम्','शृणोमि'] },
        { kannada: 'ನೀನು ಮಾಡುವೆ', correct: 'करिष्यसि', options: ['करिष्यसि','कृत्वा','कर्तुम्','करोषि'] },
        { kannada: 'ಅವನು ತಿನ್ನುವನು', correct: 'खादिष्यति', options: ['खादिष्यति','खादित्वा','खादितुम्','खादति'] },
        { kannada: 'ನಾನು ಕುಡಿಯುವೆನು', correct: 'पास्यामि', options: ['पास्यामि','पीत्वा','पातुम्','पिबामि'] },
        { kannada: 'ನೀನು ಬರುವೆ', correct: 'आगमिष्यसि', options: ['आगमिष्यसि','आगत्य','आगन्तुम्','आगच्छसि'] },

        { kannada: 'ನಾನು ನಿಲ್ಲುವೆನು', correct: 'स्थास्यामि', options: ['स्थास्यामि','स्थित्वा','स्थातुम्','तिष्ठामि'] },
        { kannada: 'ನೀನು ಹೇಳುವೆ', correct: 'वदिष्यसि', options: ['वदिष्यसि','उक्त्वा','वक्तुम्','वदसि'] },
        { kannada: 'ಅವನು ಓಡುವನು', correct: 'धाविष्यति', options: ['धाविष्यति','धावित्वा','धावितुम्','धावति'] },
        { kannada: 'ನಾನು ಆಡುವೆನು', correct: 'क्रीडिष्यामि', options: ['क्रीडिष्यामि','क्रीडित्वा','क्रीडितुम्','क्रीडामि'] },
        { kannada: 'ನೀನು ಕೊಡುವೆ', correct: 'दास्यसि', options: ['दास्यसि','दत्त्वा','दातुम्','ददासि'] },
        { kannada: 'ಅವನು ನಗುವನು', correct: 'हसिष्यति', options: ['हसिष्यति','हसित्वा','हसितुम्','हसति'] },
        { kannada: 'ನಾನು ತಿಳಿಯುವೆನು', correct: 'ज्ञास्यामि', options: ['ज्ञास्यामि','ज्ञात्वा','ज्ञातुम्','जानामि'] },
        { kannada: 'ನೀನು ಬೇಯಿಸುವೆ', correct: 'पक्ष्यसि', options: ['पक्ष्यसि','पक्त्वा','पक्तुम्','पचसि'] },
        { kannada: 'ಅವನು ಇರುವನು', correct: 'भविष्यति', options: ['भविष्यति','भूत्वा','भवितुम्','अस्ति'] },
        { kannada: 'ನಾನು ಕಲಿಯುವೆನು', correct: 'शिक्षिष्ये', options: ['शिक्षिष्ये','शिक्षित्वा','शिक्षितुम्','शिक्षे'] },
        { kannada: 'ನೀನು ಪ್ರಶ್ನಿಸುವೆ', correct: 'प्रक्ष्यसि', options: ['प्रक्ष्यसि','पृष्ट्वा','प्रष्टुम्','पृच्छसि'] },
        { kannada: 'ಅವನು ತೆಗೆದುಕೊಳ್ಳುವನು', correct: 'ग्रहीष्यति', options: ['ग्रहीष्यति','गृहीत्वा','ग्रहीतुम्','गृह्णाति'] },
        { kannada: 'ನಾನು ನಮಸ್ಕರಿಸುವೆನು', correct: 'नमिष्यामि', options: ['नमिष्यामि','नत्वा','नन्तुम्','नमामि'] },
        { kannada: 'ನೀನು ಹಾಡುವೆ', correct: 'गास्यसि', options: ['गास्यसि','गीत्वा','गातुम्','गायसि'] },
        { kannada: 'ಅವನು ಸ್ನಾನ ಮಾಡುವನು', correct: 'स्नास्यति', options: ['स्नास्यति','स्नात्वा','स्नातुम्','स्नाति'] },
        { kannada: 'ನಾನು ನಡೆಯುವೆನು', correct: 'चलिष्यामि', options: ['चलिष्यामि','चलित्वा','चलितुम्','चलामि'] },
        { kannada: 'ನೀನು ಏಳುವೆ', correct: 'उत्थास्यसि', options: ['उत्थास्यसि','उत्थाय','उत्थातुम्','उत्तिष्ठसि'] },
        { kannada: 'ಅವನು ಯೋಚಿಸುವನು', correct: 'चिन्तयिष्यति', options: ['चिन्तयिष्यति','चिन्तयित्वा','चिन्तयितुम्','चिन्तयति'] },
        { kannada: 'ನಾನು ನೆನಪಿಸುವೆನು', correct: 'स्मरिष्यामि', options: ['स्मरिष्यामि','स्मृत्वा','स्मर्तुम्','स्मरामि'] },
        { kannada: 'ನೀನು ಖರೀದಿಸುವೆ', correct: 'क्रेष्यसि', options: ['क्रेष्यसि','क्रीत्वा','क्रेतुम्','क्रीणासि'] },
        { kannada: 'ಅವನು ಬಿಡುವನು', correct: 'त्यक्ष्यति', options: ['त्यक्ष्यति','त्यक्त्वा','त्यक्तुम्','त्यजति'] },
        { kannada: 'ನಾನು ಬೀಳುವೆನು', correct: 'पतिष्यामि', options: ['पतिष्यामि','पतित्वा','पतितुम्','पतामि'] },
        { kannada: 'ನೀನು ಎಣಿಸುವೆ', correct: 'गणयिष्यसि', options: ['गणयिष्यसि','गणयित्वा','गणयितुम्','गणयसि'] },
        { kannada: 'ಅವನು ಆಗುವನು', correct: 'भविष्यति', options: ['भविष्यति','भूत्वा','भवितुम्','भवति'] },
        { kannada: 'ನಾನು ರಕ್ಷಿಸುವೆನು', correct: 'रक्षिष्यामि', options: ['रक्षिष्यामि','रक्षित्वा','रक्षितुम्','रक्षामि'] },
        { kannada: 'ನೀನು ಮಾರುವೆ', correct: 'विक्रेष्यसि', options: ['विक्रेष्यसि','विक्रीय','विक्रेतुम्','विक्रीणासि'] },
        { kannada: 'ಅವನು ಅಳುವನು', correct: 'रोदिष्यति', options: ['रोदिष्यति','रुदित्वा','रोदितुम्','रोदिति'] },
        { kannada: 'ನಾನು ತೊಳೆಯುವೆನು', correct: 'प्रक्षालयिष्यामि', options: ['प्रक्षालयिष्यामि','प्रक्षाल्य','प्रक्षालयितुम्','प्रक्षालयामि'] },
        { kannada: 'ನೀನು ಭೇಟಿಯಾಗುವೆ', correct: 'मेलिष्यसि', options: ['मेलिष्यसि','मिलित्वा','मेलितुम्','मिलसि'] },
        { kannada: 'ಅವನು ಕರೆಯುವನು', correct: 'आह्वयिष्यति', options: ['आह्वयिष्यति','आहूय','आह्वयितुम्','आह्वयति'] },
        { kannada: 'ನಾನು ಸ್ವೀಕರಿಸುವೆನು', correct: 'स्वीकरिष्यामि', options: ['स्वीकरिष्यामि','स्वीकृत्य','स्वीकर्तुम्','स्वीकरोमि'] },
        { kannada: 'ನೀನು ನರ್ತಿಸುವೆ', correct: 'नर्तिष्यसि', options: ['नर्तिष्यसि','नृत्त्वा','नर्तितुम्','नृत्यसि'] },
      ]
    }
  };

  let currentDifficulty = 'easy';
  let currentQuestion = 0;
  let questions = [];
  let score = 0;
  let timer = 120;
  let timerInterval = null;
  let answered = false;
  let gameComplete = false;

  const app = document.getElementById('app');

  function shuffle(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function prepareQuestions(diff) {
    return shuffle(verbData[diff].questions);
  }

  function startTimer() {
    clearInterval(timerInterval);
    timer = 120;
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      timer--;
      updateTimerDisplay();
      if (timer <= 0) { clearInterval(timerInterval); endGame(false); }
    }, 1000);
  }

  function updateTimerDisplay() {
    const el = document.getElementById('timerDisplay');
    if (el) { el.textContent = `⏱️ ${timer} से`; el.style.color = timer<=10?'#d32f2f':'#e86a17'; }
  }

  function endGame(won) {
    gameComplete = true;
    clearInterval(timerInterval);
    const fb = document.getElementById('feedback');
    if (fb) {
      fb.innerHTML = won
        ? `🎉 अभिनन्दनम्! Score: ${score}/${questions.length*10}`
        : `⏰ कालवसानम्! Score: ${score}`;
    }
    const controls = document.querySelector('.controls');
    if (controls) {
      controls.innerHTML = `<button class="btn restart-btn" onclick="location.reload()">🔄 पुनः क्रीडामः</button>`;
    }
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      answered = false;
      renderQuestion();
    } else {
      endGame(true);
    }
  }

  function renderQuestion() {
    if (gameComplete) return;
    const q = questions[currentQuestion];

    const html = `
      <div class="header-band">
        <p class="presenter">Team Trayee — तृयी — Presents</p>
        <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0;">
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
          <span style="font-family:'Inknut Antiqua',serif;font-size:24px;color:#e86a17;">ॐ</span>
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
        </div>
        <div class="level-badge">Level 7 · क्त्वा-तुमुन्-भविष्यत् (${verbData[currentDifficulty].name})</div>
      </div>
      <button class="btn back-btn" onclick="window.location.href='./index.html'">🗺️ मुख्य-नक्षा</button>
      <div class="info-bar">
        <span class="timer" id="timerDisplay">⏱️ ${timer} से</span>
        <span class="score-display" id="scoreDisplay">अङ्काः: ${score}</span>
        <span>प्रश्न ${currentQuestion+1}/${questions.length}</span>
      </div>
      <div class="difficulty-select">
        ${['easy','medium','hard'].map(d=>`
          <button class="diff-btn ${d===currentDifficulty?'active':''}" data-diff="${d}">
            ${d==='easy'?'📖 क्त्वा':d==='medium'?'🎯 तुमुन्':'⚡ भविष्यत्'}
          </button>
        `).join('')}
      </div>
      <div class="question-card">
        <div class="vakya-display">${q.kannada}</div>
        <div style="font-size:1.2em;color:var(--ink-maroon);margin-top:10px;">
          संस्कृतेन किम्?
        </div>
      </div>
      <div class="options-grid" id="optionsGrid">
        ${q.options.map(opt=>`<button class="option-btn">${opt}</button>`).join('')}
      </div>
      <div class="controls" id="controlsArea">
        <button class="btn next-btn" id="nextBtn" style="display:none;">⏩ अग्रिमः</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="mantra">तद्धि तपस्तद्धि तपः</div>
    `;
    app.innerHTML = html;

    document.querySelectorAll('#optionsGrid .option-btn').forEach(b => {
      b.addEventListener('click', function(e) {
        if (answered || gameComplete) return;
        const selected = e.target.textContent;
        const correct = questions[currentQuestion].correct;
        const allBtns = document.querySelectorAll('#optionsGrid .option-btn');
        allBtns.forEach(btn => btn.disabled = true);
        answered = true;

        if (selected === correct) {
          e.target.classList.add('correct');
          score += 10;
          document.getElementById('feedback').textContent = '✅ सम्यक्! +10';
        } else {
          e.target.classList.add('wrong');
          score = Math.max(0, score - 2);
          document.getElementById('feedback').textContent = `❌ उत्तरम्: ${correct} (-2)`;
          allBtns.forEach(btn => {
            if (btn.textContent === correct) btn.classList.add('correct');
          });
        }
        document.getElementById('scoreDisplay').textContent = `अङ्काः: ${score}`;
        document.getElementById('nextBtn').style.display = 'inline-block';
      });
    });

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);

    document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', function(e) {
      currentDifficulty = e.target.dataset.diff;
      questions = prepareQuestions(currentDifficulty);
      currentQuestion = 0;
      score = 0;
      answered = false;
      gameComplete = false;
      clearInterval(timerInterval);
      renderQuestion();
      startTimer();
    }));

    updateTimerDisplay();
  }

  function init() {
    questions = prepareQuestions(currentDifficulty);
    currentQuestion = 0;
    score = 0;
    answered = false;
    gameComplete = false;
    renderQuestion();
    startTimer();
  }

  init();
})();
</script>

</html>
