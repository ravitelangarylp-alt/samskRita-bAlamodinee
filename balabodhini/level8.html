      padding: 25px; margin: 15px 0;
      border: 3px solid var(--gold);
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);

    .picture-display {
      font-size: 5em;
      animation: float 3s ease-in-out infinite;
      margin: 10px 0;
    }

      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .vakya-display {
      font-family: 'Laila', serif;
      font-size: 1.8em; font-weight: 600;
      color: var(--ink-brown);
      background: #f9e4b7;
      padding: 15px;
      border-radius: 15px;
      margin: 10px 0;
    }
    .mula-shabda {

      color: var(--ink-maroon);

      margin: 10px 0;
      border: 2px solid var(--gold);
      box-shadow: 0 3px 10px rgba(200,150,12,0.3);
    }
    .options-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin: 15px 0;
    }
    .option-btn {
      padding: 18px 20px; font-size: 1.3em;
      border: 2px solid var(--gold);
      border-radius: 15px;
      background: #fff8e1;
      color: var(--ink-brown);
      font-family: 'Inknut Antiqua', serif;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;

    .option-btn:hover { background: #ffe082; transform: scale(1.03); }

    .controls { margin: 15px 0; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .btn {

    .back-btn { background: var(--gold); color: white; }
    .next-btn { background: #1565c0; color: white; font-size: 1.2em; }

    .mantra {

</head>

  function endGame(won) {
    gameComplete = true;
    clearInterval(timerInterval);
    const fb = document.getElementById('feedback');
    if (fb) {
      fb.innerHTML = won
        ? `🎉 अभिनन्दनम्! Score: ${score}/${questions.length*10}`
        : `⏰ कालवसानम्! Score: ${score}`;
    }
    const controls = document.querySelector('.controls');
    if (controls) {
      controls.innerHTML = `<button class="btn restart-btn" onclick="location.reload()">🔄 पुनः क्रीडामः</button>`;
    }
  }

  function nextQuestion() {
    if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      answered = false;
      renderQuestion();
    } else {
      endGame(true);
    }
  }

  function renderQuestion() {
    if (gameComplete) return;
    const q = questions[currentQuestion];
    const isEasy = currentDifficulty === 'easy';
    const shuffledOptions = shuffle([...q.options]);

    const html = `
      <div class="header-band">
        <p class="presenter">Team Trayee — तृयी — Presents</p>
        <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0;">
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
          <span style="font-family:'Inknut Antiqua',serif;font-size:24px;color:#e86a17;">ॐ</span>
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
        </div>
        <div class="level-badge">Level 8 · शब्द-रूपाणि (${nounData[currentDifficulty].name})</div>
      </div>
      <button class="btn back-btn" onclick="window.location.href='./index.html'">🗺️ मुख्य-नक्षा</button>
      <div class="info-bar">
        <span class="timer" id="timerDisplay">⏱️ ${timer} से</span>
        <span class="score-display" id="scoreDisplay">अङ्काः: ${score}</span>
        <span>प्रश्न ${currentQuestion+1}/${questions.length}</span>
      </div>
      <div class="difficulty-select">
        ${['easy','medium','hard'].map(d=>`
          <button class="diff-btn ${d===currentDifficulty?'active':''}" data-diff="${d}">
            ${d==='easy'?'🖼️ चित्र':d==='medium'?'📖 कन्नड':'⚡ वाक्य'}
          </button>
        `).join('')}
      </div>
      <div class="question-card">
        ${isEasy ? `
          <div class="picture-display">${q.kannada.split(' ')[0]}</div>
          <div class="mula-shabda">${q.mula}</div>
          <div style="font-size:1.3em;color:var(--ink-maroon);margin-top:10px;">${q.kannada.substring(q.kannada.indexOf('('))}</div>
        ` : `
          <div class="vakya-display">${q.kannada}</div>
          <div class="mula-shabda">मूलशब्दः · ${q.mula}</div>
        `}
        <div style="font-size:1.2em;color:var(--ink-maroon);margin-top:10px;">
          संस्कृतेन किम्?
        </div>
      </div>
      <div class="options-grid" id="optionsGrid">
        ${shuffledOptions.map(opt=>`<button class="option-btn">${opt}</button>`).join('')}
      </div>
      <div class="controls" id="controlsArea">
        <button class="btn next-btn" id="nextBtn" style="display:none;">⏩ अग्रिमः</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="mantra">तद्धि तपस्तद्धि तपः</div>
    `;
    app.innerHTML = html;

    document.querySelectorAll('#optionsGrid .option-btn').forEach(b => {
      b.addEventListener('click', function(e) {
        if (answered || gameComplete) return;
        const selected = e.target.textContent;
        const correct = questions[currentQuestion].correct;
        const allBtns = document.querySelectorAll('#optionsGrid .option-btn');
        allBtns.forEach(btn => btn.disabled = true);
        answered = true;

        if (selected === correct) {
          e.target.classList.add('correct');
          score += 10;
          document.getElementById('feedback').textContent = '✅ सम्यक्! +10';
        } else {
          e.target.classList.add('wrong');
          score = Math.max(0, score - 2);
          document.getElementById('feedback').textContent = `❌ उत्तरम्: ${correct} (-2)`;
          allBtns.forEach(btn => {
            if (btn.textContent === correct) btn.classList.add('correct');
          });
        }
        document.getElementById('scoreDisplay').textContent = `अङ्काः: ${score}`;
        document.getElementById('nextBtn').style.display = 'inline-block';
      });
    });

    document.getElementById('nextBtn').addEventListener('click', nextQuestion);

    document.querySelectorAll('.diff-btn').forEach(b => b.addEventListener('click', function(e) {
      currentDifficulty = e.target.dataset.diff;
      questions = prepareQuestions(currentDifficulty);
      currentQuestion = 0;
      score = 0;
      answered = false;
      gameComplete = false;
      clearInterval(timerInterval);
      renderQuestion();
      startTimer();
    }));

    updateTimerDisplay();
  }

  function init() {
    questions = prepareQuestions(currentDifficulty);
    currentQuestion = 0;
    score = 0;
    answered = false;
    gameComplete = false;
    renderQuestion();
    startTimer();
  }

  init();
})();
</script>
</body>
</html>
