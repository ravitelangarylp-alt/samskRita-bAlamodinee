      ],

    },
    {

      sanskritTemplate: ['_____', '_____', '_____', '_____'],
      slots: [
        { index: 0, correct: 'छात्रः', wordBank: ['छात्रः','गुरुः','पिता','कविः','राजा'] },
        { index: 1, correct: 'प्रश्नस्य', wordBank: ['प्रश्नस्य','पाठस्य','पुस्तकस्य','श्लोकस्य','वाक्यस्य'] },
        { index: 2, correct: 'उत्तरम्', wordBank: ['उत्तरम्','प्रश्नम्','वाक्यम्','पाठम्','श्लोकम्'] },

      ],

    },
    {

      sanskritTemplate: ['_____', '_____', '_____', '_____'],
      slots: [
        { index: 0, correct: 'माता', wordBank: ['माता','पिता','गुरुः','भगिनी','सखी'] },
        { index: 1, correct: 'शिशवे', wordBank: ['शिशवे','बालकाय','बालिकायै','पुत्राय','छात्राय'] },
        { index: 2, correct: 'दुग्धम्', wordBank: ['दुग्धम्','जलम्','फलम्','अन्नम्','मधु'] },

    },
    {

      sanskritTemplate: ['_____', '_____', '_____', '_____'],
      slots: [
        { index: 0, correct: 'वानराः', wordBank: ['वानराः','गजाः','सिंहाः','बालकाः','पक्षिणः'] },
        { index: 1, correct: 'वृक्षाणाम्', wordBank: ['वृक्षाणाम्','गृहाणाम्','पर्वतानाम्','भवनानाम्','फलानाम्'] },
        { index: 2, correct: 'उपरि', wordBank: ['उपरि','अधः','अन्तः','बहिः','पुरतः'] },
        { index: 3, correct: 'कूर्दन्ति', wordBank: ['कूर्दन्ति','धावन्ति','गच्छन्ति','पतन्ति','तिष्ठन्ति'] },
      ],
      fixedWords: []
    },
    {
      kannada: 'ಅವನು ದೇವಾಲಯದಲ್ಲಿ ಪುಷ್ಪಗಳನ್ನು ಅರ್ಪಿಸುತ್ತಾನೆ',
      sanskritTemplate: ['_____', '_____', '_____', '_____'],
      slots: [
        { index: 0, correct: 'सः', wordBank: ['सः','सा','अहम्','त्वम्','वयम्'] },
        { index: 1, correct: 'देवालये', wordBank: ['देवालये','विद्यालये','गृहे','उद्याने','वने'] },
        { index: 2, correct: 'पुष्पाणि', wordBank: ['पुष्पाणि','फलानि','पत्राणि','जलानि','दीपान्'] },
        { index: 3, correct: 'अर्पयति', wordBank: ['अर्पयति','ददाति','गृह्णाति','पश्यति','करोति'] },
      ],
      fixedWords: []
    },
    {
      kannada: 'ನಾವೆಲ್ಲರೂ ಸುಖವಾಗಿ ಜೀವಿಸೋಣ',
      sanskritTemplate: ['_____', '_____', '_____', '_____'],
      slots: [
        { index: 0, correct: 'वयम्', wordBank: ['वयम्','यूयम्','ते','अहम्','त्वम्'] },
        { index: 1, correct: 'सर्वे', wordBank: ['सर्वे','केचन','बहवः','द्वौ','एकः'] },
        { index: 2, correct: 'सुखेन', wordBank: ['सुखेन','दुःखेन','कष्टेन','शीघ्रम्','धीरेण'] },
        { index: 3, correct: 'जीवामः', wordBank: ['जीवामः','जीवन्ति','जीवसि','जीवति','जीवथ'] },
      ],
      fixedWords: []
    },
  ];

  let currentIdx = 0;
  let score = 0;
  let answered = false;
  let gameComplete = false;
  let slotFills = {};

  const app = document.getElementById('app');

  function renderQuestion() {
    if (gameComplete) return;
    const q = questions[currentIdx];
    slotFills = {};

    let sanskritHtml = '';
    q.sanskritTemplate.forEach((word, i) => {
      if (word === '_____') {
        sanskritHtml += `<span class="slot" data-slot="${i}">❓</span>`;
      } else {
        sanskritHtml += `<span class="fixed-word">${word}</span>`;
      }
    });

    const allWords = [];
    q.slots.forEach(s => {
      s.wordBank.forEach(w => {
        if (!allWords.includes(w)) allWords.push(w);
      });
    });

    const html = `
      <div class="header-band">
        <p class="presenter">Team Trayee — तृयी — Presents</p>
        <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0;">
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
          <span style="font-family:'Inknut Antiqua',serif;font-size:24px;color:#e86a17;">ॐ</span>
          <div style="flex:1;max-width:100px;height:1px;background:linear-gradient(to right,transparent,#c8960c,transparent);"></div>
        </div>
        <div class="level-badge">Level 9 · वाक्य-निर्माणम्</div>
      </div>
      <button class="btn back-btn" onclick="window.location.href='./index.html'">🗺️ मुख्य-नक्षा</button>
      <div class="info-bar">
        <span class="score-display" id="scoreDisplay">अङ्काः: ${score}</span>
        <span>वाक्यम् ${currentIdx+1}/${questions.length}</span>
      </div>
      <div class="kannada-sentence">${q.kannada}</div>
      <div class="sanskrit-sentence" id="sanskritSentence">${sanskritHtml}</div>
      <div class="word-bank">
        <h3>🔤 शब्द-भण्डारः</h3>
        <div class="word-chips" id="wordChips">
          ${allWords.map((w,i) => `<span class="word-chip" data-word="${w}" data-index="${i}">${w}</span>`).join('')}
        </div>
      </div>
      <div class="controls">
        <button class="btn check-btn" id="checkBtn" ${answered?'disabled':''}>✅ परीक्षते</button>
        <button class="btn reset-btn" id="resetBtn">🔄 पुनः आरभ्यते</button>
        <button class="btn next-btn" id="nextBtn" style="display:${answered?'inline-block':'none'};">⏩ अग्रिमः</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="mantra">तद्धि तपस्तद्धि तपः</div>
    `;
    app.innerHTML = html;

    document.querySelectorAll('.slot').forEach(slot => {
      slot.addEventListener('click', function() {
        if (answered || gameComplete) return;
        const slotIdx = parseInt(this.dataset.slot);
        if (slotFills[slotIdx]) {
          const word = slotFills[slotIdx];
          delete slotFills[slotIdx];
          this.textContent = '❓';
          this.classList.remove('filled');
          document.querySelectorAll('.word-chip').forEach(chip => {
            if (chip.dataset.word === word) chip.classList.remove('used');
          });
        }
      });
    });

    document.querySelectorAll('.word-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        if (answered || gameComplete) return;
        if (this.classList.contains('used')) return;
        const word = this.dataset.word;
        const slots = document.querySelectorAll('.slot');
        let filled = false;
        for (let s of slots) {
          const idx = parseInt(s.dataset.slot);
          if (!slotFills[idx]) {
            slotFills[idx] = word;
            s.textContent = word;
            s.classList.add('filled');
            this.classList.add('used');
            filled = true;
            break;
          }
        }
      });
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (answered || gameComplete) return;
      slotFills = {};
      document.querySelectorAll('.slot').forEach(s => { s.textContent = '❓'; s.classList.remove('filled'); });
      document.querySelectorAll('.word-chip').forEach(c => c.classList.remove('used'));
      document.getElementById('feedback').textContent = '';
    });

    document.getElementById('checkBtn').addEventListener('click', () => {
      if (answered || gameComplete) return;
      const allSlotsFilled = q.slots.every(s => slotFills[s.index] !== undefined);
      if (!allSlotsFilled) {
        document.getElementById('feedback').textContent = 'सर्वाणि रिक्तस्थानानि पूरयन्तु।';
        return;
      }
      answered = true;
      let correctCount = 0;
      let fbText = '';
      q.slots.forEach(s => {
        if (slotFills[s.index] === s.correct) correctCount++;
        else fbText += `स्थानम् ${s.index+1}: ${s.correct} `;
      });
      if (correctCount === q.slots.length) {
        score += 10;
        document.getElementById('feedback').textContent = '🎉 सर्वं सम्यक्! +10';
      } else {
        document.getElementById('feedback').textContent = `❌ ${correctCount}/${q.slots.length} साधु। सत्यम्: ${fbText}`;
      }
      document.getElementById('scoreDisplay').textContent = `अङ्काः: ${score}`;
      document.getElementById('checkBtn').disabled = true;
      document.getElementById('nextBtn').style.display = 'inline-block';
      document.querySelectorAll('.slot').forEach(s => {
        const idx = parseInt(s.dataset.slot);
        const slotData = q.slots.find(sl => sl.index === idx);
        if (slotData && slotFills[idx] === slotData.correct) {
          s.style.background = '#81c784';
        } else if (slotData) {
          s.style.background = '#ef9a9a';
        }
      });
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIdx < questions.length - 1) {
        currentIdx++;
        slotFills = {};
        answered = false;
        renderQuestion();
      } else {
        gameComplete = true;
        document.getElementById('feedback').innerHTML = `🎉 अभिनन्दनम्! Score: ${score}`;
      }
    });
  }

  function init() {
    currentIdx = 0;
    score = 0;
    slotFills = {};
    answered = false;
    gameComplete = false;
    renderQuestion();
  }

  init();
})();
</script>
